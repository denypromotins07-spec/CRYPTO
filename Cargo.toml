[package]
name = "crypto-trading-bot-core"
version = "0.1.0"
edition = "2021"
authors = ["Quant Systems Architect"]
description = "Ultra-low latency crypto trading bot core engine"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
rayon = "1.8"
crossbeam = "0.8"
parking_lot = "0.12"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
num_cpus = "1.16"

# Performance profiling
inferno = "0.11"

# Math and statistics
statrs = "0.16"
nalgebra = "0.32"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1